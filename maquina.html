<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máquina de Caracteres Sonoros — Máquina rítmica</title>
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/maquina.css?v=5">
</head>
<body>
<main class="maquina">
  <header>
    <a class="voltar" href="index.html">← Instruções</a>
    <h1>Máquina de Caracteres Sonoros</h1>
  </header>

  <section class="entrada" aria-label="Entrada da sequência">
    <div class="modos" role="tablist">
      <button id="modo-texto" class="botao-modo ativo" type="button">Texto</button>
      <button id="modo-digitalizador" class="botao-modo" type="button">Digitalizador</button>
    </div>

    <div id="painel-texto">
      <label for="sequencia" class="rotulo">A tua sequência</label>
      <input id="sequencia" class="campo-sequencia" type="text"
             inputmode="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="ex.: A2 + E3 + I1"
             value="A2 + E3 + I1">
      <div class="dica">Fórmula = vogal (timbre) + número (1, 2, 3). Ex.: A2, E3, U1.</div>
    </div>

    <div id="painel-desenho" hidden>
      <div class="rotulo">Área de escrita</div>
      <canvas id="area-desenho" class="area-desenho"></canvas>
      <div class="linha-desenho">
        <p id="estado-desenho" class="estado-desenho">Desenha uma vogal e depois um número</p>
        <button id="botao-limpar-desenho" class="botao-limpar" type="button">Limpar</button>
      </div>
      <div class="dica">Esquerda/direita → panorâmica · Cima/baixo → distância (reverb)</div>
    </div>

    <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
  </section>

  <section class="visual" aria-label="Célula em reprodução">
    <div id="palco" class="palco">
      <div class="celula-atual" id="celula-atual">—</div>
      <div class="pulso" id="pulso" aria-hidden="true"></div>
      <div class="posicao" id="posicao">pronto</div>
    </div>
    <div id="linha-celulas" class="linha-celulas" aria-hidden="true"></div>
  </section>

  <section class="timbres" aria-label="Vogais e timbres">
    <div class="rotulo">Vogais — timbres</div>
    <ul id="lista-timbres" class="lista-timbres"></ul>
  </section>

  <section class="controles" aria-label="Controlos de reprodução">
    <button id="botao-play" class="botao botao-play" type="button">▶ Tocar</button>
    <button id="botao-stop" class="botao botao-stop" type="button" disabled>■ Parar</button>
    <div class="andamento">
      <label for="bpm">BPM</label>
      <input id="bpm" type="range" min="60" max="180" value="120" step="1">
      <output id="bpm-valor" for="bpm">120</output>
    </div>
  </section>
</main>

<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
